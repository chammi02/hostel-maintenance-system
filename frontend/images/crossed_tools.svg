<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160" style="opacity: 0.9;">
  <g transform="translate(100,100)">
    <!-- Orange Hammer tilted 45 deg -->
    <g transform="rotate(45)">
      <!-- Hammer Handle -->
      <rect x="-8" y="-10" width="16" height="90" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
      <!-- Hammer Head -->
      <path d="M-30,-22 L30,-22 C34,-22 36,-18 34,-12 L28,-2 C26,2 22,4 18,4 L-18,4 C-22,4 -26,2 -28,-2 L-34,-12 C-36,-18 -34,-22 -30,-22 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
      <rect x="-12" y="-30" width="24" height="12" rx="3" fill="#d97706"/>
    </g>
    <!-- Gray Wrench / Spanner tilted -45 deg -->
    <g transform="rotate(-45)">
      <!-- Wrench Handle -->
      <rect x="-7" y="-20" width="14" height="100" rx="7" fill="#64748b" stroke="#475569" stroke-width="2"/>
      <!-- Open End Jaw -->
      <path d="M-22,-45 C-10,-55 10,-55 22,-45 C28,-38 25,-26 18,-22 L7,-16 L-7,-16 L-18,-22 C-25,-26 -28,-38 -22,-45 Z" fill="#64748b" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="-36" r="10" fill="#0f172a" fill-opacity="0.3"/>
      <!-- Ring End -->
      <circle cx="0" cy="80" r="14" fill="#64748b" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="80" r="7" fill="#0f172a" fill-opacity="0.3"/>
    </g>
  </g>
</svg>
